<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        h1 { color: #2c3e50; }
        p { font-size: 1.1rem; }
        .projects {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 250px;
        }
    </style>
</head>
<body>
    <h1>¡Hola, soy [Tu Nombre]!</h1>
    <p>Desarrollador / Diseñador / Creador de tecnología</p>
    
    <h2>Mis Proyectos</h2>
    <div class="projects">
        <div class="card">
            <h3>Proyecto 1</h3>
            <p>Descripción breve de tu primer gran proyecto.</p>
        </div>
        <div class="card">
            <h3>Proyecto 2</h3>
            <p>Descripción breve de tu segundo proyecto.</p>
        </div>
    </div>
</body>
</html>
